# 站点地址；结尾斜杠必需。换自定义域名时只改这一行。
baseURL = "https://gaochengjiu156.github.io/bologo/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "拾页"
enableRobotsTXT = true

# 中文按字计算词数，否则 .ReadingTime / .WordCount / .Summary 全部失真
hasCJKLanguage = true
timeZone = "Asia/Shanghai"

[params]
  description = "一个用于收藏文章、笔记与灵感的安静角落。"

[pagination]
  pagerSize = 10

[permalinks]
  # 用文件名而非标题生成路径：中文标题不会变成百分号编码的 URL
  posts = "/posts/:year/:month/:contentbasename/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    noClasses = false
